name: shopee-studio
services:
  shopee-studio:
    image: ghcr.io/saladfruiter/shopee-studio:latest
    container_name: shopee-studio
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
      DATA_DIR: /data
    ports:
      - "${BIND_IP:-0.0.0.0}:${PANEL_PORT:-8787}:8787"
    volumes:
      - shopee-data:/data
    labels:
      net.unraid.docker.webui: "http://[IP]:[PORT:8787]/"
      net.unraid.docker.managed: composeman
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  shopee-data:
